<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, Roboto, Helvetica, Arial, sans-serif">
  <title>Esquema del espacio de trabajo de Penpot</title>
  <!-- Marco de la ventana -->
  <rect x="0" y="0" width="960" height="540" rx="12" fill="#1e1f24"/>
  <rect x="0" y="0" width="960" height="34" rx="12" fill="#2a2b31"/>
  <rect x="0" y="22" width="960" height="12" fill="#2a2b31"/>
  <circle cx="22" cy="17" r="6" fill="#ea4335"/><circle cx="42" cy="17" r="6" fill="#fbbc04"/><circle cx="62" cy="17" r="6" fill="#34a853"/>
  <text x="480" y="22" fill="#9aa0a6" font-size="13" text-anchor="middle">Penpot · Proyecto de ejemplo</text>

  <!-- 2 · Panel izquierdo -->
  <rect x="12" y="46" width="210" height="482" rx="8" fill="#2a2b31" stroke="#fbbc04" stroke-width="2"/>
  <text x="28" y="74" fill="#e8eaed" font-size="14" font-weight="700">Capas</text>
  <text x="84" y="74" fill="#9aa0a6" font-size="14">Assets</text>
  <text x="146" y="74" fill="#9aa0a6" font-size="14">Tokens</text>
  <rect x="28" y="90" width="178" height="1" fill="#44464d"/>
  <g fill="#bdc1c6" font-size="13">
    <text x="28" y="116">▾ Página 1</text>
    <text x="44" y="142">▾ ▭ Board · Móvil</text>
    <text x="64" y="166">T  Título</text>
    <text x="64" y="190">▭  Botón</text>
    <text x="64" y="214">◯  Avatar</text>
    <text x="44" y="240">▸ ▭ Board · Escritorio</text>
  </g>

  <!-- 1 · Barra de herramientas (flotante sobre el lienzo) -->
  <rect x="330" y="52" width="300" height="44" rx="10" fill="#2a2b31" stroke="#fbbc04" stroke-width="2"/>
  <g fill="#e8eaed" font-size="15" text-anchor="middle">
    <text x="360" y="80">▭</text><text x="396" y="80">□</text><text x="432" y="80">◯</text>
    <text x="468" y="80" font-weight="700">T</text><text x="504" y="80">🖼</text><text x="540" y="80">✎</text><text x="576" y="80">〰</text><text x="608" y="80">💬</text>
  </g>

  <!-- 3 · Lienzo central -->
  <rect x="234" y="108" width="492" height="420" rx="8" fill="#e8eaed" stroke="#fbbc04" stroke-width="2"/>
  <rect x="396" y="150" width="170" height="300" rx="14" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text x="400" y="144" fill="#4285f4" font-size="12">Board · Móvil</text>
  <rect x="416" y="178" width="130" height="14" rx="3" fill="#5f6368"/>
  <circle cx="481" cy="250" r="34" fill="#dadce0"/>
  <rect x="426" y="400" width="110" height="30" rx="15" fill="#ea4335"/>
  <text x="481" y="420" fill="#fff" font-size="12" text-anchor="middle">Botón</text>

  <!-- 4 · Panel derecho -->
  <rect x="738" y="46" width="210" height="482" rx="8" fill="#2a2b31" stroke="#fbbc04" stroke-width="2"/>
  <text x="754" y="74" fill="#e8eaed" font-size="14" font-weight="700">Diseño</text>
  <text x="814" y="74" fill="#9aa0a6" font-size="14">Prototipo</text>
  <text x="884" y="74" fill="#9aa0a6" font-size="14">Inspect</text>
  <rect x="754" y="90" width="178" height="1" fill="#44464d"/>
  <g fill="#bdc1c6" font-size="13">
    <text x="754" y="116">Tamaño y posición</text>
    <text x="754" y="160">Flex Layout / Grid</text>
    <text x="754" y="204">Relleno</text>
    <rect x="840" y="192" width="16" height="16" rx="3" fill="#ea4335"/><text x="864" y="205">#EA4335</text>
    <text x="754" y="248">Tipografía</text>
    <text x="754" y="292">Borde · Sombra</text>
  </g>

  <!-- Números de zona (coinciden con la tabla de la unidad) -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#202124">
    <circle cx="646" cy="74" r="15" fill="#fbbc04"/><text x="646" y="80">1</text>
    <circle cx="200" cy="506" r="15" fill="#fbbc04"/><text x="200" y="512">2</text>
    <circle cx="704" cy="506" r="15" fill="#fbbc04"/><text x="704" y="512">3</text>
    <circle cx="926" cy="506" r="15" fill="#fbbc04"/><text x="926" y="512">4</text>
  </g>
</svg>
